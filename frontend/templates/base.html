<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ descricao }}">
    <title>{{ paginas[pagina] }} | Seleção Feminina Brasileira</title>
    <link rel="icon" href="/assets/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/base.css">
    <script src="/js/portal.js" defer></script>
    <link rel="stylesheet" href="/css/tema.css">
</head>
<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <!-- MENU COMPARTILHADO -->
    {% include "componentes/menu.html" %}
    <main id="conteudo" tabindex="-1">
        <!-- TOPO COMPARTILHADO -->
        {% if pagina != 'index.html' %}
        <section class="hero pagina-hero">
            <div class="container">
                <h1>{{ paginas[pagina] }}</h1>
                <p>{{ descricao }}</p>
            </div>
        </section>
        {% endif %}
        <!-- INÍCIO DO CONTEÚDO DA PÁGINA -->
        {% block conteudo %}{% endblock %}
        <!-- FIM DO CONTEÚDO DA PÁGINA -->
    </main>
    <!-- RODAPÉ COMPARTILHADO -->
    {% include "componentes/rodape.html" %}
</body>
</html>
