<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon.png?v=2">
    <meta name="description" content="Notícias, elenco, jogos e história da Seleção Feminina Brasileira.">
    <title> Seleção Feminina Brasileira</title>
    <link rel="stylesheet" href="../css/styles.css">
    <!-- defer executa o script depois que os elementos da página foram interpretados. -->
    <script src="../js/styles.js" defer></script>
</head>
<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
        <div class="container barra-navegacao">
            <a class="marca" href="../index.html" aria-label="Seleção Feminina Brasileira — início">
                <img class="marca-logo" src="../assets/logo.webp" alt="" width="44" height="48">
                <span>Seleção Feminina Brasileira</span>
            </a>
            <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu-principal">
                <span class="sr-only">Abrir menu</span><span></span><span></span><span></span>
            </button>
            <nav id="menu-principal" class="menu" aria-label="Navegação principal">
                <a href="../index.html">Início</a>
                <a href="noticias.html">Notícias</a>
                <a href="elenco.html">Elenco</a>
                <a href="proximos_jogos.html">Próximos jogos</a>
                <a href="historia.html">História</a>
            </nav>
        </div>
    </header>
    <main id="conteudo" tabindex="-1">
        <section class="secao container" aria-labelledby="login-titulo">
            <h1 id="login-titulo">Entrar</h1>
            <form id="login-form" action="/api/login" method="post">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
                <br><br>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                <br><br>
                <button type="submit">Entrar</button>
                <p id="login-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer class="rodape">
        <div class="container rodape-conteudo">
            <p><strong>Seleção Feminina Brasileira</strong></p>
            <p><span data-ano>2026</span> — Projeto Interdisciplinar</p>
        </div>
    </footer>
</body>
</html>
